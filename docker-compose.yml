# Labo « Recherche & graphes » — aiopsatlas.com
#
# Une seule commande démarre tout :   docker compose up -d
# Avec OpenSearch en plus :           docker compose --profile opensearch up -d
#
# Choix volontaires pour un labo d'apprentissage (PAS pour la production) :
#   - sécurité désactivée (pas de mot de passe, HTTP en clair) → zéro certificat à gérer
#   - une seule instance de chaque moteur (discovery.type=single-node)
#   - versions figées : le cours est testé avec exactement ces images
#   - seuil disque désactivé : un portable presque plein ne bloque pas l'écriture
#   - les fichiers du labo sont montés en lecture seule dans /labo à l'intérieur
#     des conteneurs, pour importer sans rien installer sur la machine hôte

name: labo-recherche-graphes

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: labo-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - cluster.name=labo
      - node.name=labo-es-1
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./elasticsearch:/labo:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3
    container_name: labo-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_PUBLICBASEURL=http://localhost:5601
      - I18N_LOCALE=fr-FR
      - TELEMETRY_ENABLED=false
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: labo-neo4j
    environment:
      - NEO4J_AUTH=neo4j/aiopsatlas2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      # /import est le point de montage prévu par l'image : LOAD CSV FROM 'file:///x.csv' lit ici
      - ./neo4j/import:/import:ro
      - ./neo4j:/labo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # --- Profil « opensearch » : démarré seulement avec --profile opensearch ---
  # Ports décalés (9201 / 5602) pour cohabiter avec Elasticsearch et Kibana.
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: labo-opensearch
    profiles: ["opensearch"]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - cluster.name=labo-opensearch
      - node.name=labo-os-1
      - cluster.routing.allocation.disk.threshold_enabled=false
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9201:9200"
    volumes:
      - os-data:/usr/share/opensearch/data
      - ./elasticsearch:/labo:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: labo-opensearch-dashboards
    profiles: ["opensearch"]
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5602:5601"
    restart: unless-stopped

volumes:
  es-data:
  neo4j-data:
  os-data:
